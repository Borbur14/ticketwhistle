# TicketWhistle engine: read the 20 LaLiga clubs every 30 minutes, refresh the open data, commit it.
# The website, the API (/api/live/*) and the MCP server read the committed JSON, so no site re-publish is needed.
# GitHub's own schedule can skip or delay runs for hours, so each run keeps going for ~5.5 h and scans
# every 30 minutes itself. The schedule only has to fire a few times a day to keep the data fresh.
name: engine
on:
  schedule: [{ cron: "7,37 * * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: engine, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Get the engine
        run: |
          curl -fsSL https://ticketwhistle.com/assets/x/e-d0487cb3fd29404deafab1f9.tgz -o /tmp/e.tgz
          mkdir -p /tmp/tw && tar -xzf /tmp/e.tgz -C /tmp/tw
          pip install -q requests beautifulsoup4
          git config user.name "ticketwhistle-engine"
          git config user.email "engine@ticketwhistle.com"
      - name: Scan every 30 minutes
        run: |
          IDS=$(cd /tmp/tw/engine && python -c "from engine.sources import S; print(','.join(s['id'] for s in S if 'LL' in s['league']))")
          END=$(( $(date +%s) + 330*60 ))
          while :; do
            START=$(date +%s)
            git pull -q --rebase || true
            mkdir -p data
            [ -f data/es.db ] || cp /tmp/tw/engine/out/seed.db data/es.db
            ( cd /tmp/tw/engine && TQ_DB=$GITHUB_WORKSPACE/data/es.db timeout 1200 python run.py scan --clubs "$IDS" ) || echo "scan failed, keeping last data"
            cp /tmp/tw/engine/out/last_scan_log.json data/last_scan_log.json 2>/dev/null || true
            python /tmp/tw/site-builder/build.py --db data/es.db --out public --base https://ticketwhistle.com --data-only || echo "build failed"
            git add data public
            if git commit -qm "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"; then
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 10; done
            fi
            NEXT=$(( START + 30*60 ))
            [ $NEXT -ge $END ] && break
            sleep $(( NEXT - $(date +%s) > 0 ? NEXT - $(date +%s) : 0 ))
          done
